{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Surveyor Map</title>
    <link rel="stylesheet" href="https://{{request.META.HTTP_HOST}}{% static 'css/base.css' %}">
    <link rel="icon" href="https://{{request.META.HTTP_HOST}}{% static 'favicon.ico' %}">
    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet" 
        ntegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
</head>
<body>
    {% if source_name %}
    <div id="toc">
        <ul class="list-group list-group-horizontal-sm" style="padding: 0px;">
            <li class="list-group-item" style="font-size: smaller; padding: 2px; background-color: #2f3067;">
                <img src="https://{{request.META.HTTP_HOST}}{% static 'everynet-logo-2.svg' %}" alt="Everynet" style="height: 20px;">
            </li>
            <li class="list-group-item" style="background-color: yellow; font-size: smaller; padding: 2px;">
                <img src="https://{{request.META.HTTP_HOST}}{% static 'Surveyor03_16.png' %}">
                <strong></strong>Surveyor Map</strong>
            </li>
            <li class="list-group-item" style="font-size: smaller; padding: 2px;">Source: {{ source_name }}</li>
            <li class="list-group-item" style="font-size: smaller; padding: 2px;">Meas: {{ meas }}</li>
            <li class="list-group-item" style="font-size: smaller; padding: 2px;">Start: {{ start_mark }}</li>
            <li class="list-group-item" style="font-size: smaller; padding: 2px;">End: {{ end_mark }}</li>
        </ul>
    </div>
    </div>
    {% endif %}
    <div>
        {{ popout_map_html|safe }}
    </div>
    <div>
        Software Source: <a href="https://github.com/sheeriot/surveyor">RF Field Surveyor @ GitHub</a>
    </div>
</body>
</html>
